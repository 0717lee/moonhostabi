name: Verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  spike:
    name: Spike / ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-latest
            wasm_asset: wasm-tools-1.258.0-x86_64-linux.tar.gz
            wasm_sha256: b52d14eb74a4852cc249369bd4480c2b2fdd876145f41db51ff52269ded240ce
          - name: Windows x86_64
            os: windows-latest
            wasm_asset: wasm-tools-1.258.0-x86_64-windows.zip
            wasm_sha256: 527fe5c3ef5363c58888548827bb44c87fcbf17bb2a2df295055788d82c72081
    env:
      # MOONBIT_SNAPSHOT is the installer/archive identity; MOONBIT_VERSION is
      # the version printed by the installed moon/moonrun binaries.
      MOONBIT_SNAPSHOT: 0.10.11+6ff76a5f9
      MOONBIT_SNAPSHOT_URL: 0.10.11%2B6ff76a5f9
      MOONBIT_LINUX_ARCHIVE_SHA256: 9573f4df56ff7fe99aa200ddeabc379919e80203c37986642d8e74add1a7e7be
      MOONBIT_WINDOWS_ARCHIVE_SHA256: f08e1d54efff3a99319f686b11ceb1a1454288e460e7f20a77219f8d4e08f538
      MOONBIT_VERSION: 0.1.20260827
      MOONBIT_COMMIT: d0aaa07
      MOONC_VERSION: v0.10.11+6ff76a5f9
      MOONBIT_RELEASE_DATE: 2026-08-27
      MOONBIT_UNIX_INSTALLER_SHA256: 46495f8cdc0050f79b6cb195d66478d101cb3601d68506568fbe377fcdf2a9fe
      MOONBIT_WINDOWS_INSTALLER_SHA256: a5101e91ffa9905fb25cd009b9a4aa942971a294bd055c89836e3af89b710c64
      WASM_TOOLS_VERSION: 1.258.0
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.12.0
          cache: npm
          cache-dependency-path: runtime/package-lock.json

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Install exact MoonBit toolchain on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          installer="$RUNNER_TEMP/moonbit-install.sh"
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh -o "$installer"
          echo "$MOONBIT_UNIX_INSTALLER_SHA256  $installer" | sha256sum -c -
          snapshot_archive="$RUNNER_TEMP/moonbit-snapshot-linux.tar.gz"
          curl -fsSL "https://cli.moonbitlang.com/binaries/$MOONBIT_SNAPSHOT_URL/moonbit-linux-x86_64.tar.gz" -o "$snapshot_archive"
          echo "$MOONBIT_LINUX_ARCHIVE_SHA256  $snapshot_archive" | sha256sum -c -
          rm -f "$snapshot_archive"
          MOONBIT_INSTALL_VERSION="$MOONBIT_SNAPSHOT" bash "$installer"
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Install exact MoonBit toolchain on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'moonbit-install.ps1'
          Invoke-WebRequest https://cli.moonbitlang.com/install/powershell.ps1 -OutFile $installer
          $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $installer).Hash.ToLowerInvariant()
          if ($actual -cne $env:MOONBIT_WINDOWS_INSTALLER_SHA256) {
            throw "MoonBit installer checksum mismatch: $actual"
          }
          $snapshotArchive = Join-Path $env:RUNNER_TEMP 'moonbit-snapshot-windows.zip'
          try {
            Invoke-WebRequest -Uri "https://cli.moonbitlang.com/binaries/$env:MOONBIT_SNAPSHOT_URL/moonbit-windows-x86_64.zip" -OutFile $snapshotArchive
            $snapshotActual = (Get-FileHash -Algorithm SHA256 -LiteralPath $snapshotArchive).Hash.ToLowerInvariant()
            if ($snapshotActual -cne $env:MOONBIT_WINDOWS_ARCHIVE_SHA256) {
              throw "MoonBit snapshot archive checksum mismatch: $snapshotActual"
            }
          } finally {
            if (Test-Path -LiteralPath $snapshotArchive) { [IO.File]::Delete($snapshotArchive) }
          }
          $env:MOONBIT_INSTALL_VERSION = $env:MOONBIT_SNAPSHOT
          & pwsh -NoProfile -ExecutionPolicy Bypass -File $installer
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          (Join-Path $env:USERPROFILE '.moon\bin') | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Install exact wasm-tools release
        shell: pwsh
        env:
          WASM_ASSET: ${{ matrix.wasm_asset }}
          WASM_SHA256: ${{ matrix.wasm_sha256 }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (
            [Runtime.InteropServices.RuntimeInformation]::OSArchitecture -ne
            [Runtime.InteropServices.Architecture]::X64
          ) {
            throw 'This matrix entry requires an x86_64 runner.'
          }
          $archive = Join-Path $env:RUNNER_TEMP $env:WASM_ASSET
          $installRoot = Join-Path $env:RUNNER_TEMP 'wasm-tools-install'
          $uri = "https://github.com/bytecodealliance/wasm-tools/releases/download/v$env:WASM_TOOLS_VERSION/$env:WASM_ASSET"
          Invoke-WebRequest -Uri $uri -OutFile $archive
          $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $archive).Hash.ToLowerInvariant()
          if ($actual -cne $env:WASM_SHA256) {
            throw "wasm-tools archive checksum mismatch: $actual"
          }
          [IO.Directory]::CreateDirectory($installRoot) | Out-Null
          if ($IsWindows) {
            Expand-Archive -LiteralPath $archive -DestinationPath $installRoot
            $executableName = 'wasm-tools.exe'
          } else {
            & tar -xzf $archive -C $installRoot
            if ($LASTEXITCODE -ne 0) {
              throw "tar failed with exit code $LASTEXITCODE"
            }
            $executableName = 'wasm-tools'
          }
          $executables = @(
            Get-ChildItem -LiteralPath $installRoot -Recurse -File |
              Where-Object { $_.Name -ceq $executableName }
          )
          if ($executables.Count -ne 1) {
            throw "Expected one wasm-tools executable, found $($executables.Count)"
          }
          $executables[0].DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Show external tool versions
        shell: pwsh
        run: |
          $moonVersion = moon version --all
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $moonVersion | Write-Output
          $identityLines = @(
            $moonVersion | Where-Object { $_ -cmatch '^(?:moon|moonc|moonrun) ' }
          )
          if ($identityLines.Count -ne 3) {
            throw 'MoonBit version output must contain exactly moon, moonc, and moonrun identities.'
          }
          $expectedPrefixes = @(
            "moon $env:MOONBIT_VERSION ($env:MOONBIT_COMMIT $env:MOONBIT_RELEASE_DATE) ",
            "moonc $env:MOONC_VERSION ($env:MOONBIT_RELEASE_DATE) ",
            "moonrun $env:MOONBIT_VERSION ($env:MOONBIT_COMMIT $env:MOONBIT_RELEASE_DATE) "
          )
          foreach ($prefix in $expectedPrefixes) {
            if (@($identityLines | Where-Object { $_.StartsWith($prefix, [StringComparison]::Ordinal) }).Count -ne 1) {
              throw "Unexpected MoonBit toolchain version."
            }
          }
          node --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          wasm-tools --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install hash-pinned workflow validator
        shell: pwsh
        run: python -m pip install --disable-pip-version-check --index-url=https://pypi.org/simple --require-hashes -r scripts/requirements-workflow-validation.txt

      - name: Install locked npm dependencies
        shell: pwsh
        run: npm --prefix runtime ci --registry=https://registry.npmjs.org

      - name: Install Chromium and Linux system dependencies
        if: runner.os == 'Linux'
        shell: pwsh
        run: npm --prefix runtime exec -- playwright install --with-deps chromium

      - name: Install Chromium on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: npm --prefix runtime exec -- playwright install chromium

      - name: Run the reproducible Spike gate
        shell: pwsh
        run: |
          $verifyLog = Join-Path $env:RUNNER_TEMP 'moonhostabi-verify.log'
          try {
            & ./scripts/verify-spike.ps1 *>&1 | Tee-Object -FilePath $verifyLog
          } catch {
            $_ | Out-String | Tee-Object -FilePath $verifyLog -Append
            throw
          }

      - name: Verify generated artifacts remain reproducible
        shell: pwsh
        run: |
          git diff --exit-code
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $unexpected = git status --short
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not [String]::IsNullOrWhiteSpace(($unexpected -join "`n"))) {
            $unexpected | Write-Output
            throw 'Verification left unexpected files in the checkout.'
          }

      - name: Upload failure diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: moonhostabi-diagnostics-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/moonhostabi-verify.log
            runtime/test-results
            runtime/playwright-report
          if-no-files-found: ignore
          retention-days: 14
